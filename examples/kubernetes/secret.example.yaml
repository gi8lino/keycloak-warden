# EXAMPLE ONLY: copy outside the repository, replace all values, then apply.
# Do not commit real signing secrets, administrator tokens, or Cloudflare tokens.
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-snitch
  namespace: keycloak
type: Opaque
stringData:
  KC_SPI_EVENTS_LISTENER__SNITCH__WEBHOOK_SECRET: "REPLACE_WITH_SHARED_SNITCH_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-warden
  namespace: keycloak
type: Opaque
stringData:
  WARDEN__ADMIN_TOKEN: "REPLACE_WITH_RANDOM_ADMIN_TOKEN"
  warden.yaml: |
    rule:
      threshold: 5
      window: 1m
      ban: 15m
    targets:
      edge:
        enabled: true
        provider: cloudflare
        zone-id: "REPLACE_WITH_32_HEX_CHARACTER_ZONE_ID"
        secret: "REPLACE_WITH_CLOUDFLARE_API_TOKEN"
