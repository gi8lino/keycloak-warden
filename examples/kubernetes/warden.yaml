rule:
  threshold: 5
  window: 1m
  ban: 15m

targets:
  ops:
    enabled: false
    provider: webhook
    url: https://receiver.example/events
    secret: env:WARDEN_WEBHOOK_SECRET
  edge:
    enabled: false
    provider: cloudflare
    zone-id: env:CLOUDFLARE_ZONE_ID
    secret: env:CLOUDFLARE_API_TOKEN
