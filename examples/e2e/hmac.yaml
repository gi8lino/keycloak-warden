# Verify Warden's outbound HMAC-SHA256 webhook signature.
max-body-bytes: 65536
hmac:
  enabled: true
  secret-env: WEBHOOK_SECRET
  algorithm: sha256
  signature-header: X-Warden-Signature
  signature-prefix: "v1="
  signature-encoding: hex
  message-format: "{timestamp}.{body}"
  timestamp-header: X-Warden-Timestamp
  timestamp-format: unix
  max-age: 5m
