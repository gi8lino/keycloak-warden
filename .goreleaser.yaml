---
project_name: keycloak-warden
version: 2

builds:
  - id: keycloak-warden
    main: ./cmd/warden
    binary: keycloak-warden
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{ .Tag }}

dockers_v2:
  - id: keycloak-warden
    ids:
      - keycloak-warden
    dockerfile: Dockerfile.goreleaser
    images:
      - ghcr.io/gi8lino/keycloak-warden
    tags:
      - "{{ .Tag }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.description: "{{ .ProjectName }}"
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: https://github.com/gi8lino/keycloak-warden
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.url: https://github.com/gi8lino/keycloak-warden
      org.opencontainers.image.version: "{{ .Tag }}"
