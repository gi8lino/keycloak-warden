---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
resources:
  - persistentvolumeclaim.yaml
  - deployment.yaml
  - service.yaml
# Secrets are intentionally created separately; never apply example placeholders.

configMapGenerator:
  - name: keycloak-warden-config
    files:
      - warden.yaml

  - name: keycloak-warden-templates
    files:
      - templates/ban-slack-api.json.tmpl
      - templates/ban-slack-bot.json.tmpl
      - templates/ban-msteams.json.tmpl
      - templates/incident-slack-api.json.tmpl
      - templates/incident-slack-bot.json.tmpl
      - templates/incident-msteams.json.tmpl
