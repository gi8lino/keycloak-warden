---
name: Autorelease

# Only PR metadata is processed. Do not checkout or execute PR code here.
on:
  pull_request_target:
    types:
      - synchronize
      - labeled
      - unlabeled
      - closed

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-release-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create a release tag from merged PR labels
        uses: projectsyn/pr-label-tag-action@v1
        with:
          trigger: |
            Build
