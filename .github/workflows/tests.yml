---
name: Tests

on:
  workflow_call:
  pull_request:
    branches:
      - main
    paths:
      - "cmd/**"
      - "internal/**"
      - "test/**"
      - "examples/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "bin/dev-tools.mk"
      - "Dockerfile"
      - "Dockerfile.goreleaser"
      - ".dockerignore"
      - ".goreleaser.yaml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies and development tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          make dev-tools
          go mod download

      - name: Verify module manifests
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Format, lint and race-test
        run: make verify

      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.20.1
          install-only: true

      - name: Check GoReleaser configuration
        run: goreleaser check

  e2e:
    name: Keycloak → Snitch → Warden → Hookglass
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Check Docker Compose
        run: docker compose version

      - name: Run end-to-end tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: make e2e-test

      - name: Show service logs on failure
        if: ${{ failure() && steps.checkout.outcome == 'success' }}
        run: docker compose -p keycloak-warden-e2e -f test/e2e/compose.yaml logs --no-color --tail=200

      - name: Remove E2E containers and volumes
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: make e2e-reset
